        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, duration, type = 'sine') {
            try {
                initAudio();
                if (navigator.vibrate) navigator.vibrate(15);
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function playClearSound(lines) {
            try {
                initAudio();
                if (navigator.vibrate) navigator.vibrate(20 * lines);

                let notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
                let noteCount = Math.min(1 + lines * 2, notes.length);
                let startTime = audioCtx.currentTime;

                for (let i = 0; i < noteCount; i++) {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = (lines >= 3) ? 'triangle' : 'sine';
                    let noteTime = startTime + i * 0.055;
                    let noteDur = 0.18;

                    osc.frequency.setValueAtTime(notes[i], noteTime);
                    osc.frequency.exponentialRampToValueAtTime(notes[i] * 1.06, noteTime + noteDur);

                    gain.gain.setValueAtTime(0.15, noteTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, noteTime + noteDur);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(noteTime);
                    osc.stop(noteTime + noteDur);
                }
            } catch (e) {}
        }

        function playMusicStep() {
            if (!musicEnabled || !audioCtx) return;
            try {
                let note = MELODY_NOTES[musicStep % MELODY_NOTES.length];
                let t = audioCtx.currentTime;

                if (note.freq) {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(note.freq, t);
                    gain.gain.setValueAtTime(0.025, t);
                    gain.gain.exponentialRampToValueAtTime(0.0005, t + note.dur);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(t);
                    osc.stop(t + note.dur);
                }

                if (note.bass) {
                    let bassOsc = audioCtx.createOscillator();
                    let bassGain = audioCtx.createGain();
                    bassOsc.type = 'triangle';
                    bassOsc.frequency.setValueAtTime(note.bass, t);
                    bassGain.gain.setValueAtTime(0.035, t);
                    bassGain.gain.exponentialRampToValueAtTime(0.0005, t + 0.8);
                    bassOsc.connect(bassGain);
                    bassGain.connect(audioCtx.destination);
                    bassOsc.start(t);
                    bassOsc.stop(t + 0.8);
                }

                musicStep++;
            } catch(e) {}
        }

        function toggleBackgroundMusic() {
            musicEnabled = !musicEnabled;
            if (musicEnabled) {
                initAudio();
                musicStep = 0;
                musicInterval = setInterval(playMusicStep, 280);
            } else {
                if (musicInterval) clearInterval(musicInterval);
            }

                    currentLang = parsed.currentLang || "de";
                    isLandscape = parsed.isLandscape || false;
                    if (parsed.shopUpgrades) shopUpgrades = { ...shopUpgrades, ...parsed.shopUpgrades };
                    if (parsed.stats) stats = { ...stats, ...parsed.stats };
                    if (parsed.achievements) achievements = { ...achievements, ...parsed.achievements };
                    if (THEME_PALETTES[activeThemeKey]) {
                        arcadeBlockColors = THEME_PALETTES[activeThemeKey].colors;
                    }
                }
            } catch (e) {}
            applyCanvasDimensions();
        }

        function saveGameData() {
            try {
                let data = { highscore, highscoreZeit, coins, maxAdvLevel, lastDailyClaim, dailyStreak, unlockedThemes, activeThemeKey, currentLang, isLandscape, shopUpgrades, stats, achievements };
                localStorage.setItem("nexobrix_xxl_save_v18", JSON.stringify(data));
            } catch (e) {}
        }

        loadGameData();

        function getDaysDiff(dateString) {
            if (!dateString) return 999;
            let today = new Date();
            today.setHours(0,0,0,0);
            let last = new Date(dateString);
            last.setHours(0,0,0,0);
            return Math.round((today - last) / (1000 * 60 * 60 * 24));
        }

        function canClaimDaily() {
            let today = new Date().toDateString();
            return lastDailyClaim !== today;
        }

        function spawnParticles(x, y, count = 6, customColors = null, isConfetti = false) {
            let colors = customColors || arcadeBlockColors;
            for (let i = 0; i < count; i++) {
                let speedMult = isConfetti ? 2.5 : 1;
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10 * speedMult,
                    vy: (Math.random() - 0.5) * 10 * speedMult,
                    radius: Math.random() * (isConfetti ? 6 : 5) + (isConfetti ? 4 : 3),
                    lifetime: Math.random() * (isConfetti ? 40 : 20) + (isConfetti ? 30 : 15),
                    color: colors[Math.floor(Math.random() * colors.length)],
                    isConfetti: isConfetti,
                    isStar: shopUpgrades.starParticles
                });
            }
        }

        function addFloatingText(text, x, y, color = "#FACC15") {
            floatingTexts.push({ text, x, y, lifetime: 45, color });
        }

        function updateEffects() {
            for (let mp of menuParticles) {
                mp.y += mp.vy;
                if (mp.y < 0) { mp.y = canvas.height; mp.x = Math.random() * canvas.width; }
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                if (p.isConfetti) p.vy += 0.3;
                p.x += p.vx; p.y += p.vy;
                p.radius -= 0.15; p.lifetime--;
                if (p.lifetime <= 0 || p.radius <= 0) particles.splice(i, 1);
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1.8; ft.lifetime--;
                if (ft.lifetime <= 0) floatingTexts.splice(i, 1);
            }
            if (shakeIntensity > 0) shakeIntensity--;
            if (screenFlash > 0) screenFlash -= 0.04;
        }

        function drawEffects() {
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                if (p.isStar) {
                    let r = Math.max(1, p.radius * 1.5);
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.font = `${Math.round(r * 2)}px ${FONT_TITLE}`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("✦", 0, 0);
                    ctx.restore();
                } else if (p.isConfetti) {
                    ctx.fillRect(p.x, p.y, p.radius, p.radius);
                } else {
                    ctx.arc(p.x, p.y, Math.max(0, p.radius), 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            for (let ft of floatingTexts) {
                ctx.save();
                ctx.font = `bold 34px ${FONT_TITLE}`;
                ctx.fillStyle = ft.color;
                ctx.shadowColor = "#000";
                ctx.shadowBlur = 10;
                ctx.textAlign = "center";
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }
            if (screenFlash > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, screenFlash)})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function getRandomBlock() {
            let shape = BASE_SHAPES[Math.floor(Math.random() * BASE_SHAPES.length)];
            let color = arcadeBlockColors[Math.floor(Math.random() * arcadeBlockColors.length)];
            return { shape, color, stype: "normal" };
        }

        function generateNewBlocks() {
            for (let i = 0; i < 3; i++) {
                current_blocks[i] = getRandomBlock();
            }
            if (shopUpgrades.startTnt && current_blocks[0] !== null) {
                current_blocks[0] = { shape: [[0, 0]], color: "#EF4444", stype: "tnt" };
            }
        }

        function rotateShapeData(blockData) {
            let rotated = blockData.shape.map(([x, y]) => [-y, x]);
            let minX = Math.min(...rotated.map(p => p[0]));
            let minY = Math.min(...rotated.map(p => p[1]));
            let normalized = rotated.map(([x, y]) => [x - minX, y - minY]);
            return { shape: normalized, color: blockData.color, stype: blockData.stype };
        }

        function drawRoundRect(x, y, w, h, radius, fillColor, strokeColor, lineWidth) {
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, radius);
            if (fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
            if (strokeColor) { ctx.strokeStyle = strokeColor; ctx.lineWidth = lineWidth || 1; ctx.stroke(); }
        }

        function drawCoinIcon(cx, cy, radius = 18) {
            ctx.save();
            ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
            ctx.shadowBlur = 6;
            ctx.shadowOffsetY = 3;

            let outerGrad = ctx.createLinearGradient(cx - radius, cy - radius, cx + radius, cy + radius);
            outerGrad.addColorStop(0, "#FEF08A");
            outerGrad.addColorStop(0.5, "#EAB308");
            outerGrad.addColorStop(1, "#854D0E");
            ctx.fillStyle = outerGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();

            let innerGrad = ctx.createRadialGradient(cx - radius*0.3, cy - radius*0.3, radius*0.1, cx, cy, radius*0.8);
            innerGrad.addColorStop(0, "#FDE047");
            innerGrad.addColorStop(1, "#CA8A04");
            ctx.fillStyle = innerGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.78, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#FEF08A";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.78, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "#FEF08A";
            ctx.font = `bold ${Math.round(radius * 1.1)}px ${FONT_TITLE}`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("★", cx, cy + 1);

            ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
            ctx.beginPath();
            ctx.arc(cx - radius * 0.35, cy - radius * 0.35, radius * 0.25, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawArcadeBlock(x, y, size, colorHex, stype = "normal") {
            drawRoundRect(x, y, size, size, 12, colorHex, "rgba(0,0,0,0.3)", 2);
            
            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            ctx.beginPath();
            ctx.roundRect(x + 4, y + 4, size - 8, size / 2 - 2, 8);
            ctx.fill();

            let cx = x + size / 2;
            let cy = y + size / 2;
            if (stype === "tnt") {
                ctx.fillStyle = "#FFF"; ctx.font = `bold 16px ${FONT_TITLE}`; ctx.textAlign = "center"; ctx.fillText("TNT", cx, cy + 6); ctx.textAlign = "left";
            } else if (stype === "laser") {
                ctx.fillStyle = "#FFF"; ctx.font = `bold 20px ${FONT_TITLE}`; ctx.textAlign = "center"; ctx.fillText("⚡", cx, cy + 7); ctx.textAlign = "left";
            } else if (stype === "obstacle") {
                ctx.fillStyle = "#94A3B8"; ctx.font = `bold 16px ${FONT_TITLE}`; ctx.textAlign = "center"; ctx.fillText("🔒", cx, cy + 6); ctx.textAlign = "left";
            } else if (stype === "jewel") {
                ctx.fillStyle = "#FEF08A"; ctx.font = `bold 22px ${FONT_TITLE}`; ctx.textAlign = "center"; ctx.fillText("💎", cx, cy + 8); ctx.textAlign = "left";
            }
        }

        function drawBlockShape(blockData, startX, startY, size, gap) {
            for (let coord of blockData.shape) {
                let bx = startX + coord[0] * (size + gap);
                let by = startY + coord[1] * (size + gap);
                drawArcadeBlock(bx, by, size, blockData.color, blockData.stype);
            }
        }

        function drawBoosterIcon(type, cx, cy) {
            ctx.save();
            if (type === "rotate") {
                ctx.strokeStyle = "#38BDF8"; ctx.lineWidth = 4.5; ctx.lineCap = "round"; ctx.shadowColor = "rgba(56, 189, 248, 0.6)"; ctx.shadowBlur = 8;
                ctx.beginPath(); ctx.arc(cx, cy, 15, -Math.PI * 0.7, Math.PI * 0.8); ctx.stroke();
                ctx.fillStyle = "#38BDF8"; ctx.beginPath(); ctx.moveTo(cx + 12, cy - 12); ctx.lineTo(cx + 22, cy - 2); ctx.lineTo(cx + 8, cy - 2); ctx.closePath(); ctx.fill();
                drawRoundRect(cx - 5, cy - 5, 10, 10, 2, "#38BDF8", null);
            } else if (type === "shuffle") {
                ctx.strokeStyle = "#FACC15"; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.shadowColor = "rgba(250, 204, 21, 0.6)"; ctx.shadowBlur = 8;
                ctx.beginPath(); ctx.moveTo(cx - 16, cy - 10); ctx.bezierCurveTo(cx - 4, cy - 10, cx + 4, cy + 10, cx + 16, cy + 10); ctx.stroke();
                ctx.fillStyle = "#FACC15"; ctx.beginPath(); ctx.moveTo(cx + 16, cy + 10); ctx.lineTo(cx + 8, cy + 4); ctx.lineTo(cx + 8, cy + 16); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(cx - 16, cy + 10); ctx.bezierCurveTo(cx - 4, cy + 10, cx + 4, cy - 10, cx + 16, cy - 10); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 16, cy - 10); ctx.lineTo(cx + 8, cy - 16); ctx.lineTo(cx + 8, cy - 4); ctx.closePath(); ctx.fill();
            } else if (type === "clear2") {
                ctx.shadowColor = "rgba(34, 197, 94, 0.6)"; ctx.shadowBlur = 8;
                drawRoundRect(cx - 18, cy - 13, 36, 10, 4, "#22C55E", null);
                drawRoundRect(cx - 18, cy + 3, 36, 10, 4, "#22C55E", null);
                ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
                ctx.beginPath(); ctx.moveTo(cx - 20, cy - 16); ctx.lineTo(cx + 20, cy + 16); ctx.stroke();
            } else if (type === "tnt") {
                ctx.shadowColor = "rgba(239, 68, 68, 0.8)"; ctx.shadowBlur = 10;
                drawRoundRect(cx - 14, cy - 8, 8, 24, 3, "#EF4444", "#7F1D1D", 1);
                drawRoundRect(cx - 4, cy - 11, 8, 27, 3, "#DC2626", "#7F1D1D", 1);
                drawRoundRect(cx + 6, cy - 8, 8, 24, 3, "#EF4444", "#7F1D1D", 1);
                ctx.fillStyle = "#FACC15"; ctx.fillRect(cx - 15, cy, 30, 5);
                ctx.strokeStyle = "#F97316"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(cx, cy - 11); ctx.quadraticCurveTo(cx + 4, cy - 20, cx + 10, cy - 18); ctx.stroke();
                ctx.fillStyle = "#FEF08A"; ctx.beginPath(); ctx.arc(cx + 10, cy - 18, 3.5, 0, Math.PI * 2); ctx.fill();
            } else if (type === "laser") {
                ctx.fillStyle = "#06B6D4"; ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 2; ctx.shadowColor = "rgba(6, 182, 212, 0.9)"; ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.moveTo(cx + 3, cy - 20); ctx.lineTo(cx - 14, cy + 1); ctx.lineTo(cx - 2, cy + 1); ctx.lineTo(cx - 7, cy + 20); ctx.lineTo(cx + 14, cy - 1); ctx.lineTo(cx + 2, cy - 1); ctx.closePath(); ctx.fill(); ctx.stroke();
            }
            ctx.restore();
        }

        function getShapeDimensions(shape) {
            let maxX = Math.max(...shape.map(p => p[0])) + 1;
            let maxY = Math.max(...shape.map(p => p[1])) + 1;
            return { w: maxX, h: maxY };
        }

        function canPlace(shape, gridCol, gridRow) {
            for (let coord of shape) {
                let c = gridCol + coord[0];
                let r = gridRow + coord[1];
                if (c < 0 || c >= GRID_SIZE || r < 0 || r >= GRID_SIZE) return false;
                if (grid[r][c] !== null) return false;
            }
            return true;
        }

        function placeBlock(blockData, gridCol, gridRow) {
            let stype = blockData.stype;
            let gp = getGridParams();
            stats.totalBlocksPlaced++;

            if (stype === "tnt" || stype === "laser") {
                shakeIntensity = 15; screenFlash = 0.4;
                playSound(stype === "tnt" ? 120 : 500, 0.4, stype === "tnt" ? 'square' : 'sine');
                
                let points = 0;
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        let inRange = false;
                        if (stype === "tnt" && Math.abs(r - gridRow) <= 1 && Math.abs(c - gridCol) <= 1) inRange = true;
                        if (stype === "laser" && (r === gridRow || c === gridCol)) inRange = true;
                        
                        if (inRange && grid[r][c] !== null) {
                            if (grid[r][c].stype === "jewel") advJewelsCollected++;
                            grid[r][c] = null;
                            spawnParticles(gp.offsetX + c*(gp.cellSize+gp.gap) + gp.cellSize/2, gp.offsetY + r*(gp.cellSize+gp.gap) + gp.cellSize/2, 5, ["#EF4444", "#38BDF8", "#FFF"]);
                            points += 50;
                        }
                    }
                }
                score += (stype === "tnt" ? 300 : 400) + points;
                stats.totalScore += (stype === "tnt" ? 300 : 400);
                addFloatingText(stype.toUpperCase() + "!", gp.offsetX + gridCol*(gp.cellSize+gp.gap), gp.offsetY + gridRow*(gp.cellSize+gp.gap), "#EF4444");
                checkAdventureWinCondition();
                return;
            }

            for (let coord of blockData.shape) {
                grid[gridRow + coord[1]][gridCol + coord[0]] = { color: blockData.color, stype: blockData.stype };
            }
        }

        function clearLines() {
            let rowsToClear = [];
            let colsToClear = [];
            let gp = getGridParams();

            for (let r = 0; r < GRID_SIZE; r++) {
                if (grid[r].every(cell => cell !== null)) rowsToClear.push(r);
            }
            for (let c = 0; c < GRID_SIZE; c++) {
                if (grid.every(row => row[c] !== null)) colsToClear.push(c);
            }

            let cleared = rowsToClear.length + colsToClear.length;
            if (cleared > 0) {
                let pts = cleared * 120 * cleared;
                score += pts;
                
                let earnedCoins = cleared * (shopUpgrades.doubleCoins ? 10 : 5);
                coins += earnedCoins;

                stats.totalLinesCleared += cleared;
                stats.totalScore += pts;
                if (cleared >= 2) stats.totalCombos++;

                shakeIntensity = 6 * cleared;
                playClearSound(cleared);

                if (cleared >= 2) {
                    screenFlash = Math.min(1.0, 0.4 + (cleared * 0.15));
                    spawnParticles(canvas.width / 2, canvas.height / 2, 40 * cleared, null, true);
                }

                // Nur die betroffenen ZEILEN leeren
                for (let r of rowsToClear) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (grid[r][c]) {
                            if (grid[r][c].stype === "jewel") advJewelsCollected++;
                            spawnParticles(gp.offsetX + c*(gp.cellSize+gp.gap) + gp.cellSize/2, gp.offsetY + r*(gp.cellSize+gp.gap) + gp.cellSize/2, 8);
                            grid[r][c] = null;
                        }
                    }
                }
                // Nur die betroffenen SPALTEN leeren
                for (let c of colsToClear) {
                    for (let r = 0; r < GRID_SIZE; r++) {
                        if (grid[r][c]) {
                            if (grid[r][c].stype === "jewel") advJewelsCollected++;
                            spawnParticles(gp.offsetX + c*(gp.cellSize+gp.gap) + gp.cellSize/2, gp.offsetY + r*(gp.cellSize+gp.gap) + gp.cellSize/2, 8);
                            grid[r][c] = null;
                        }
                    }
                }

                if (cleared >= 2) {
                    addFloatingText(`Combo ${cleared}!`, canvas.width / 2, gp.offsetY - 25, "#38BDF8");
                } else {
                    addFloatingText(`+${pts}`, canvas.width / 2, gp.offsetY - 25, "#FACC15");
                }

                if (currentMode === "ADVENTURE") {
                    advLinesCleared += cleared;
                    checkAdventureWinCondition();
                }

                if (currentMode === "ZEIT" || (currentMode === "ADVENTURE" && advLevelType === "time")) {
                    let maxT = shopUpgrades.extraTime ? 55.0 : 45.0;
                    timeLeft = Math.min(maxT, timeLeft + cleared * 4.0);
                    if (score > highscoreZeit) highscoreZeit = score;
                } else {
                    if (score > highscore) highscore = score;
                }
                saveGameData();
            }
        }

        function checkGameOver() {
            for (let i = 0; i < 3; i++) {
                if (current_blocks[i] !== null) {
                    let shape = current_blocks[i].shape;
                    for (let r = 0; r < GRID_SIZE; r++) {
                        for (let c = 0; c < GRID_SIZE; c++) {
                            if (canPlace(shape, c, r)) return false;
                        }
                    }
                }
            }
            return true;
        }

        function checkAdventureWinCondition() {
            if (currentMode !== "ADVENTURE") return;
            let success = false;
            if (advLevelType === "lines" || advLevelType === "time") {
                if (advLinesCleared >= advTargetLines) success = true;
            } else if (advLevelType === "jewel") {
                if (advJewelsCollected >= advJewelsTotal) success = true;
            }

            if (success && !levelComplete) {
                levelComplete = true;
                playSound(880, 0.4, 'sine');
                addFloatingText(t("levelCleared"), canvas.width / 2, canvas.height / 2 - 50, "#22C55E");
                spawnParticles(canvas.width/2, canvas.height/2, 50, null, true);
                if (selectedAdvLevel === maxAdvLevel && maxAdvLevel < 30) maxAdvLevel++;
                
                let bonus = shopUpgrades.doubleCoins ? 100 : 50;
                coins += bonus;
                saveGameData();
            }
        }

        function startGameSession(mode, lvlNum = 1) {
            currentMode = mode;
            selectedAdvLevel = lvlNum;
            gameState = "GAME";
            score = 0;
            let baseTime = shopUpgrades.extraTime ? 45.0 : 35.0;
            timeLeft = mode === "ZEIT" ? baseTime : 45.0;
            gameOver = false;
            levelComplete = false;
            rotateModeActive = false;
            stats.totalGamesPlayed++;

            if (mode === "ADVENTURE") {
                grid = Array(8).fill(null).map(() => Array(8).fill(null));
                advLinesCleared = 0;
                advJewelsCollected = 0;

                if (lvlNum % 3 === 0) {
                    advLevelType = "time";
                    advTargetLines = 4 + Math.floor(lvlNum * 1.4);
                    timeLeft = Math.max(18.0, baseTime + 10.0 - (lvlNum * 0.8));
                } else if (lvlNum % 3 === 2) {
                    advLevelType = "jewel";
                    advJewelsTotal = 3 + Math.floor(lvlNum * 0.7);
                    
                    let placed = 0;
                    while (placed < advJewelsTotal) {
                        let r = Math.floor(Math.random() * 6) + 1;
                        let c = Math.floor(Math.random() * 8);
                        if (grid[r][c] === null) {
                            grid[r][c] = { color: "#FACC15", stype: "jewel" };
                            placed++;
                        }
                    }

                    if (lvlNum >= 8) {
                        let obstacleCount = Math.min(12, Math.floor((lvlNum - 6) * 0.5));
                        let obsPlaced = 0;
                        while (obsPlaced < obstacleCount) {
                            let r = Math.floor(Math.random() * 6) + 1;
                            let c = Math.floor(Math.random() * 8);
                            if (grid[r][c] === null) {
                                grid[r][c] = { color: "#475569", stype: "obstacle" };
                                obsPlaced++;
                            }
                        }
                    }
                } else {
                    advLevelType = "lines";
                    advTargetLines = 4 + Math.floor(lvlNum * 1.8);
                    let obstacleCount = Math.min(22, 2 + Math.floor(lvlNum * 0.8));
                    let placed = 0;
                    while (placed < obstacleCount) {
                        let r = Math.floor(Math.random() * 6) + 1;
                        let c = Math.floor(Math.random() * 8);
                        if (grid[r][c] === null) {
                            grid[r][c] = { color: "#475569", stype: "obstacle" };
                            placed++;
                        }
                    }
                }
            } else {
                grid = Array(8).fill(null).map(() => Array(8).fill(null));
            }
            generateNewBlocks();
            saveGameData();
        }

        function executeBooster(type) {
            stats.boostersUsed++;
            if (type === "rotate") {
                rotateModeActive = !rotateModeActive;
                addFloatingText(rotateModeActive ? t("rotateInstruction") : t("rotateOff"), canvas.width / 2, canvas.height - 120, "#FACC15");
            } else if (type === "shuffle") {
                if (coins < 40) { addFloatingText(t("noCoins"), canvas.width / 2, canvas.height - 120, "#EF4444"); return; }
                coins -= 40;
                saveGameData();
                generateNewBlocks();
                playSound(650, 0.2, 'sine');
                addFloatingText(t("shuffled"), canvas.width / 2, canvas.height - 120, "#38BDF8");
            } else if (type === "clear2") {
                if (coins < 100) { addFloatingText(t("noCoins"), canvas.width / 2, canvas.height - 120, "#EF4444"); return; }
                coins -= 100;
                saveGameData();
                shakeIntensity = 12;
                score += 300;
                let gp = getGridParams();
                let clearedCount = 0;
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (grid[r].some(c => c !== null) && clearedCount < 2) {
                        for (let c = 0; c < GRID_SIZE; c++) {
                            if (grid[r][c] && grid[r][c].stype === "jewel") advJewelsCollected++;
                            if (grid[r][c]) spawnParticles(gp.offsetX + c*(gp.cellSize+gp.gap), gp.offsetY + r*(gp.cellSize+gp.gap), 5);
                            grid[r][c] = null;
                        }
                        clearedCount++;
                    }
                }
                addFloatingText(t("rowsCleared"), canvas.width / 2, canvas.height - 120, "#22C55E");
                playSound(900, 0.2, 'square');
            } else if (type === "tnt" || type === "laser") {
                let cost = 120;
                if (coins < cost) { addFloatingText(t("noCoins"), canvas.width / 2, canvas.height - 120, "#EF4444"); return; }
                let freeIdx = current_blocks.findIndex(b => b === null);
                if (freeIdx === -1) { addFloatingText(t("noSlot"), canvas.width / 2, canvas.height - 120, "#EF4444"); return; }
                coins -= cost;
                saveGameData();
                if (type === "tnt") {
                    current_blocks[freeIdx] = { shape: [[0, 0]], color: "#EF4444", stype: "tnt" };
                    addFloatingText(t("tntBought"), canvas.width / 2, canvas.height - 120, "#EF4444");
                } else {
                    current_blocks[freeIdx] = { shape: [[0, 0]], color: "#38BDF8", stype: "laser" };
                    addFloatingText(t("laserBought"), canvas.width / 2, canvas.height - 120, "#38BDF8");
                }
                playSound(600, 0.15, 'sine');
            }
        }

        let BTN_MENU_ADVENTURE, BTN_MENU_CLASSIC, BTN_MENU_ZEIT, BTN_MENU_SHOP, BTN_MENU_ACHIEVEMENTS, BTN_MENU_DAILY, BTN_MENU_ORIENT, BTN_MENU_LANG;

                let y = startY + r * (boxH + gapY);
                let rect = { x, y, w: boxW, h: boxH, lvl };

        }

        function drawGame() {
            let offX = (Math.random() - 0.5) * shakeIntensity;
            let offY = (Math.random() - 0.5) * shakeIntensity;
            ctx.save();
            ctx.translate(offX, offY);
            ctx.fillStyle = THEME.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let gp = getGridParams();
            let slotRects = getSlotRects();
            let boosterRects = getBoosterRects();

            drawRoundRect(BTN_BACK.x, BTN_BACK.y, BTN_BACK.w, BTN_BACK.h, 10, "#3B3BBF", "#5C5CEB", 2);

            ctx.fillText(currentMode === "ADVENTURE" ? t("backMap") : t("backMenu"), BTN_BACK.x + 8, BTN_BACK.y + 25);

            let coinBoxX = isLandscape ? 1140 : 455;

            ctx.fillStyle = "#FFFFFF"; ctx.font = `bold 20px ${FONT_TITLE}`; ctx.textAlign = "left";
            ctx.fillText(coins, coinBoxX + 51, 50);

            let titleCenterX = isLandscape ? 300 : canvas.width / 2;
            if (currentMode === "ADVENTURE") {
                ctx.font = `bold 22px ${FONT_TITLE}`; ctx.textAlign = "center"; ctx.fillStyle = "#38BDF8";
                ctx.fillText(`LEVEL ${selectedAdvLevel} (${advLevelType.toUpperCase()})`, titleCenterX, 35);
                ctx.font = `bold 26px ${FONT_TITLE}`; ctx.fillStyle = "#FFFFFF";
                let goalText = advLevelType === "jewel" ? `${t("jewels")}: ${advJewelsCollected} / ${advJewelsTotal}` : `${t("rows")}: ${advLinesCleared} / ${advTargetLines}`;
                ctx.fillText(goalText, titleCenterX, 68);
            } else {
                ctx.font = `bold 22px ${FONT_TITLE}`; ctx.textAlign = "center"; ctx.fillStyle = "#FACC15";
                ctx.fillText(`👑 ${currentMode === 'ZEIT' ? highscoreZeit : highscore}`, titleCenterX, 32);
                ctx.font = `bold 42px ${FONT_TITLE}`; ctx.fillStyle = "#FFFFFF";
                ctx.fillText(score, titleCenterX, 72);
            }

            if (currentMode === "ZEIT" || (currentMode === "ADVENTURE" && advLevelType === "time")) {
                let barX = isLandscape ? 580 : 15;
                let barY = isLandscape ? 70 : 135;
                let barW = isLandscape ? 690 : 570;
                drawRoundRect(barX, barY, barW, 13, 6, "#282852", null);
                let maxT = shopUpgrades.extraTime ? 55.0 : 45.0;
                let ratio = Math.max(0, timeLeft / (currentMode === "ZEIT" ? (shopUpgrades.extraTime ? 45.0 : 35.0) : maxT));
                drawRoundRect(barX, barY, Math.floor(barW * ratio), 13, 6, timeLeft < 8 ? "#EF4444" : "#38BDF8", null);
            }

            let gridPxW = (GRID_SIZE * gp.cellSize) + ((GRID_SIZE - 1) * gp.gap);
            drawRoundRect(gp.offsetX - 10, gp.offsetY - 10, gridPxW + 20, gridPxW + 20, 16, "#15152E", "#2D2D5E", 3);

            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    let x = gp.offsetX + col * (gp.cellSize + gp.gap);
                    let y = gp.offsetY + row * (gp.cellSize + gp.gap);
                    let cell = grid[row][col];
                    if (cell !== null) {
                        drawArcadeBlock(x, y, gp.cellSize, cell.color, cell.stype);
                    } else {
                        drawRoundRect(x, y, gp.cellSize, gp.cellSize, 10, THEME.grid_empty, null);
                    }
                }
            }

            for (let i = 0; i < 3; i++) {
                let slot = slotRects[i];
                drawRoundRect(slot.x, slot.y, slot.w, slot.h, 18, THEME.card_bg, THEME.card_border, 3);
                if (current_blocks[i] !== null && i !== selected_block_idx) {
                    let b = current_blocks[i];
                    let dim = getShapeDimensions(b.shape);
                    let sSize = gp.cellSize * 0.58;
                    let sGap = gp.gap * 0.58;
                    let bW = dim.w * (sSize + sGap);
                    let bH = dim.h * (sSize + sGap);
                    drawBlockShape(b, slot.x + (slot.w - bW) / 2, slot.y + (slot.h - bH) / 2, sSize, sGap);
                }
            }

            boosterRects.forEach(b => {
                let isSelected = (b.type === "rotate" && rotateModeActive);
                drawRoundRect(b.x, b.y, b.w, b.h, 16, isSelected ? "#FACC15" : "#2A2A5C", "#3F3F8C", 2);
                ctx.fillStyle = THEME.text; ctx.font = `bold 14px ${FONT_TITLE}`; ctx.textAlign = "center";
                ctx.fillText(t(b.labelKey), b.x + b.w/2, b.y + 26);
                
                drawBoosterIcon(b.type, b.x + b.w/2, b.y + 100);

                ctx.fillStyle = "#FACC15"; ctx.font = `700 15px ${FONT_UI}`;
                ctx.fillText(`${b.cost} Coins`, b.x + b.w/2, b.y + 165);
                ctx.textAlign = "left";
            });

            if (dragging && selected_block_idx !== null && current_blocks[selected_block_idx] !== null) {
                drawBlockShape(current_blocks[selected_block_idx], block_x, block_y, gp.cellSize, gp.gap);
            }

            if (levelComplete) {
                let dialogX = isLandscape ? 425 : 75;
                let dialogY = isLandscape ? 160 : 420;
                drawRoundRect(dialogX, dialogY, 450, 280, 22, "#2A2A5C", "#4C4CCF", 4);
                ctx.fillStyle = "#22C55E"; ctx.font = `bold 42px ${FONT_TITLE}`; ctx.textAlign = "center";
                ctx.fillText(t("levelCleared"), dialogX + 225, dialogY + 65);
                ctx.fillStyle = THEME.text; ctx.font = `700 22px ${FONT_UI}`;
                ctx.fillText(t("levelDone", { lvl: selectedAdvLevel }), dialogX + 225, dialogY + 125);
                ctx.fillText(t("tapNext"), dialogX + 225, dialogY + 185);
                ctx.textAlign = "left";
            } else if (gameOver) {
                let dialogX = isLandscape ? 410 : 60;
                let dialogY = isLandscape ? 90 : 360;
                drawRoundRect(dialogX, dialogY, 480, 420, 22, "#2A2A5C", "#EF4444", 4);
                ctx.fillStyle = "#EF4444"; ctx.font = `bold 42px ${FONT_TITLE}`; ctx.textAlign = "center";
                ctx.fillText(t("gameOver"), dialogX + 240, dialogY + 60);
                ctx.fillStyle = THEME.text; ctx.font = `700 20px ${FONT_UI}`;
                ctx.fillText((timeLeft <= 0) ? t("timeUp") : t("noMoves"), dialogX + 240, dialogY + 105);

                drawRoundRect(dialogX + 30, dialogY + 145, 420, 60, 18, "#2563EB", "#38BDF8", 3);
                ctx.fillStyle = "#FFFFFF"; ctx.font = `bold 20px ${FONT_TITLE}`; ctx.fillText(t("watchAd"), dialogX + 240, dialogY + 183);

                drawRoundRect(dialogX + 30, dialogY + 215, 420, 55, 18, "#15803D", "#22C55E", 2);
                ctx.fillStyle = "#FFFFFF"; ctx.font = `bold 18px ${FONT_TITLE}`; ctx.fillText(t("reviveCoins"), dialogX + 240, dialogY + 250);

                drawRoundRect(dialogX + 30, dialogY + 280, 420, 50, 18, "#3B3BBF", "#5C5CEB", 2);
                ctx.fillStyle = "#CBD5E1"; ctx.font = `700 18px ${FONT_UI}`; ctx.fillText(t("restart"), dialogX + 240, dialogY + 311);
                ctx.textAlign = "left";
            }

            drawEffects();
            ctx.restore();
        }

        function getMousePos(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            let clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            
            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;
            
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function triggerRewardedAdForRevive() {
            if (window.CrazyGames && window.CrazyGames.SDK && window.CrazyGames.SDK.ad) {
                window.CrazyGames.SDK.ad.requestAd("rewarded", {
                    adStarted: () => { if (musicEnabled && audioCtx) audioCtx.suspend(); },
                    adError: (error) => {
                        console.log("Ad error:", error);
                        if (musicEnabled && audioCtx) audioCtx.resume();
                        addFloatingText(t("noAd"), canvas.width / 2, canvas.height / 2, "#EF4444");
                    },
                    adFinished: () => {
                        if (musicEnabled && audioCtx) audioCtx.resume();
                        revivePlayerAction();
                    }
                });
            } else {
                revivePlayerAction();
            }
        }

        function revivePlayerAction() {
            gameOver = false;
            timeLeft = shopUpgrades.extraTime ? 45.0 : 35.0;
            for (let r = 5; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    grid[r][c] = null;
                }
            }
            generateNewBlocks();
            saveGameData();
            playSound(880, 0.3, 'square');
            addFloatingText(t("revived"), canvas.width / 2, canvas.height / 2, "#22C55E");
        }

        function updateDragPosition(pos, blockData) {
            let gp = getGridParams();
            let dim = getShapeDimensions(blockData.shape);
            
            block_x = pos.x - (dim.w * (gp.cellSize + gp.gap)) / 2;
            
            if (isLandscape) {
                block_y = pos.y - (dim.h * (gp.cellSize + gp.gap)) / 2;
            } else {
                block_y = pos.y - (dim.h * (gp.cellSize + gp.gap)) - 40;
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            let pos = getMousePos(e);

            if (gameState === "MENU") {
                if (pos.x >= BTN_MENU_LANG.x && pos.x <= BTN_MENU_LANG.x + BTN_MENU_LANG.w && pos.y >= BTN_MENU_LANG.y && pos.y <= BTN_MENU_LANG.y + BTN_MENU_LANG.h) {
                    currentLang = currentLang === "de" ? "en" : "de";
                    saveGameData(); playSound(600, 0.1, 'sine'); return;
                }
                if (pos.x >= BTN_MENU_ORIENT.x && pos.x <= BTN_MENU_ORIENT.x + BTN_MENU_ORIENT.w && pos.y >= BTN_MENU_ORIENT.y && pos.y <= BTN_MENU_ORIENT.y + BTN_MENU_ORIENT.h) {
                    isLandscape = !isLandscape;
                    applyCanvasDimensions();
                    saveGameData(); playSound(700, 0.15, 'sine'); return;
                }
                if (pos.x >= BTN_MENU_ADVENTURE.x && pos.x <= BTN_MENU_ADVENTURE.x + BTN_MENU_ADVENTURE.w && pos.y >= BTN_MENU_ADVENTURE.y && pos.y <= BTN_MENU_ADVENTURE.y + BTN_MENU_ADVENTURE.h) {
                    gameState = "MAP"; mapPage = 0;
                } else if (pos.x >= BTN_MENU_CLASSIC.x && pos.x <= BTN_MENU_CLASSIC.x + BTN_MENU_CLASSIC.w && pos.y >= BTN_MENU_CLASSIC.y && pos.y <= BTN_MENU_CLASSIC.y + BTN_MENU_CLASSIC.h) {
                    startGameSession("CLASSIC");
                } else if (pos.x >= BTN_MENU_ZEIT.x && pos.x <= BTN_MENU_ZEIT.x + BTN_MENU_ZEIT.w && pos.y >= BTN_MENU_ZEIT.y && pos.y <= BTN_MENU_ZEIT.y + BTN_MENU_ZEIT.h) {
                    startGameSession("ZEIT");
                } else if (pos.x >= BTN_MENU_SHOP.x && pos.x <= BTN_MENU_SHOP.x + BTN_MENU_SHOP.w && pos.y >= BTN_MENU_SHOP.y && pos.y <= BTN_MENU_SHOP.y + BTN_MENU_SHOP.h) {
                    gameState = "SHOP"; shopTab = "skins"; shopPage = 0;
                } else if (pos.x >= BTN_MENU_ACHIEVEMENTS.x && pos.x <= BTN_MENU_ACHIEVEMENTS.x + BTN_MENU_ACHIEVEMENTS.w && pos.y >= BTN_MENU_ACHIEVEMENTS.y && pos.y <= BTN_MENU_ACHIEVEMENTS.y + BTN_MENU_ACHIEVEMENTS.h) {
                    gameState = "ACHIEVEMENTS"; achPage = 0;
                } else if (pos.x >= BTN_MENU_DAILY.x && pos.x <= BTN_MENU_DAILY.x + BTN_MENU_DAILY.w && pos.y >= BTN_MENU_DAILY.y && pos.y <= BTN_MENU_DAILY.y + BTN_MENU_DAILY.h) {
                    gameState = "WHEEL"; wheelResult = null; wheelSpinning = false;
                } else {
                    let cardX = 60, cardY = isLandscape ? 165 : 305;
                    if (pos.x >= cardX + 45 && pos.x <= cardX + 220 && pos.y >= cardY + 110 && pos.y <= cardY + 130) {
                        toggleBackgroundMusic();
                    }
                }
            } else if (gameState === "ACHIEVEMENTS") {
                if (pos.x >= BTN_BACK.x && pos.x <= BTN_BACK.x + BTN_BACK.w && pos.y >= BTN_BACK.y && pos.y <= BTN_BACK.y + BTN_BACK.h) {
                    gameState = "MENU"; return;
                }
                let navY = isLandscape ? 520 : 1020;
                let prevX = isLandscape ? 450 : 120;
                let nextX = isLandscape ? 730 : 360;
                if (pos.x >= prevX && pos.x <= prevX + 120 && pos.y >= navY && pos.y <= navY + 45) {
                    if (achPage > 0) achPage--; playSound(500, 0.1, 'sine'); return;
                }
                if (pos.x >= nextX && pos.x <= nextX + 120 && pos.y >= navY && pos.y <= navY + 45) {
                    let maxPages = Math.ceil(Object.keys(achievements).length / 6);
                    if (achPage < maxPages - 1) achPage++; playSound(500, 0.1, 'sine'); return;
                }
                achievementRects.forEach(rect => {
                    if (pos.x >= rect.x && pos.x <= rect.x + rect.w && pos.y >= rect.y && pos.y <= rect.y + rect.h) {
                        if (rect.canClaim) {
                            let ach = achievements[rect.key];
                            ach.claimed = true;
                            coins += ach.reward;
                            saveGameData();
                            playSound(950, 0.4, 'square');
                            spawnParticles(rect.x + rect.w/2, rect.y + rect.h/2, 20, ["#FACC15", "#22C55E"]);
                            addFloatingText(`+${ach.reward} COINS!`, canvas.width/2, rect.y, "#22C55E");
                        }
                    }
                });
            } else if (gameState === "WHEEL") {
                if (pos.x >= BTN_BACK.x && pos.x <= BTN_BACK.x + BTN_BACK.w && pos.y >= BTN_BACK.y && pos.y <= BTN_BACK.y + BTN_BACK.h) {
                    gameState = "MENU"; return;
                }
                let btnX = isLandscape ? 700 : 150;
                let btnY = isLandscape ? 280 : 840;
                let btnW = isLandscape ? 380 : 300;
                if (canClaimDaily() && !wheelSpinning) {
                    if (pos.x >= btnX && pos.x <= btnX + btnW && pos.y >= btnY && pos.y <= btnY + 65) {
                        wheelSpinning = true; wheelResult = null; wheelVelocity = 0.35 + Math.random() * 0.25; playSound(450, 0.1, 'sine');
                    }
                }
            } else if (gameState === "SHOP") {
                if (pos.x >= BTN_BACK.x && pos.x <= BTN_BACK.x + BTN_BACK.w && pos.y >= BTN_BACK.y && pos.y <= BTN_BACK.y + BTN_BACK.h) {
                    gameState = "MENU"; return;
                }
                let tabW = isLandscape ? 300 : 235;
                let tab1X = isLandscape ? 320 : 50;
                let tab2X = isLandscape ? 680 : 315;
                if (pos.x >= tab1X && pos.x <= tab1X + tabW && pos.y >= 125 && pos.y <= 170) {
                    shopTab = "skins"; shopPage = 0; playSound(500, 0.1, 'sine'); return;
                }
                if (pos.x >= tab2X && pos.x <= tab2X + tabW && pos.y >= 125 && pos.y <= 170) {
                    shopTab = "upgrades"; shopPage = 0; playSound(500, 0.1, 'sine'); return;
                }

                if (shopTab === "skins") {
                    let navY = isLandscape ? 535 : 1000;
                    let prevX = isLandscape ? 450 : 120;
                    let nextX = isLandscape ? 730 : 360;
                    if (pos.x >= prevX && pos.x <= prevX + 120 && pos.y >= navY && pos.y <= navY + 45) {
                        if (shopPage > 0) shopPage--; playSound(500, 0.1, 'sine'); return;
                    }
                    if (pos.x >= nextX && pos.x <= nextX + 120 && pos.y >= navY && pos.y <= navY + 45) {
                        let maxPages = Math.ceil(Object.keys(THEME_PALETTES).length / 4);
                        if (shopPage < maxPages - 1) shopPage++; playSound(500, 0.1, 'sine'); return;
                    }
                }

                shopItemRects.forEach(item => {
                    if (pos.x >= item.x && pos.x <= item.x + item.w && pos.y >= item.y && pos.y <= item.y + item.h) {
                        if (item.type === "skin") {
                            let themeKey = item.key;
                            let theme = THEME_PALETTES[themeKey];
                            if (unlockedThemes.includes(themeKey)) {
                                activeThemeKey = themeKey; arcadeBlockColors = theme.colors; saveGameData(); playSound(500, 0.1, 'sine');
                            } else {
                                if (coins >= theme.cost) {
                                    coins -= theme.cost; unlockedThemes.push(themeKey); activeThemeKey = themeKey; arcadeBlockColors = theme.colors; saveGameData();
                                    playSound(900, 0.3, 'square'); addFloatingText(t("unlockedTheme"), canvas.width / 2, canvas.height / 2, "#22C55E");
                                } else { addFloatingText(t("noCoins"), canvas.width / 2, canvas.height / 2, "#EF4444"); }
                            }
                        } else if (item.type === "upgrade") {
                            if (!shopUpgrades[item.key]) {
                                if (coins >= item.cost) {
                                    coins -= item.cost; shopUpgrades[item.key] = true; saveGameData();
                                    playSound(900, 0.3, 'square'); addFloatingText(t("unlockedUpgrade"), canvas.width / 2, canvas.height / 2, "#22C55E");
                                } else { addFloatingText(t("noCoins"), canvas.width / 2, canvas.height / 2, "#EF4444"); }
                            }
                        }
                    }
                });
            } else if (gameState === "MAP") {
                if (pos.x >= BTN_BACK.x && pos.x <= BTN_BACK.x + BTN_BACK.w && pos.y >= BTN_BACK.y && pos.y <= BTN_BACK.y + BTN_BACK.h) {
                    gameState = "MENU"; return;
                }
                let navY = isLandscape ? 500 : 915;
                let prevX = isLandscape ? 450 : 120;
                let nextX = isLandscape ? 730 : 360;
                if (pos.x >= prevX && pos.x <= prevX + 120 && pos.y >= navY && pos.y <= navY + 45) {
                    if (mapPage > 0) mapPage--; playSound(500, 0.1, 'sine'); return;
                }
                if (pos.x >= nextX && pos.x <= nextX + 120 && pos.y >= navY && pos.y <= navY + 45) {
                    if (mapPage < 1) mapPage++; playSound(500, 0.1, 'sine'); return;
                }

                for (let r of mapRects) {
                    if (pos.x >= r.x && pos.x <= r.x + r.w && pos.y >= r.y && pos.y <= r.y + r.h) {
                        if (r.lvl <= maxAdvLevel) startGameSession("ADVENTURE", r.lvl);
                    }
                }
            } else if (gameState === "GAME") {
                if (levelComplete) {
                    if (selectedAdvLevel < 30) startGameSession("ADVENTURE", selectedAdvLevel + 1); else gameState = "MAP"; return;
                }
                if (gameOver) {
                    let dialogX = isLandscape ? 410 : 60;
                    let dialogY = isLandscape ? 90 : 360;
                    if (pos.x >= dialogX + 30 && pos.x <= dialogX + 450 && pos.y >= dialogY + 145 && pos.y <= dialogY + 205) { triggerRewardedAdForRevive(); return; }
                    if (pos.x >= dialogX + 30 && pos.x <= dialogX + 450 && pos.y >= dialogY + 215 && pos.y <= dialogY + 270) {
                        if (coins >= 100) { coins -= 100; revivePlayerAction(); } else { addFloatingText(t("noCoins"), canvas.width / 2, canvas.height / 2, "#EF4444"); } return;
                    }
                    if (pos.x >= dialogX + 30 && pos.x <= dialogX + 450 && pos.y >= dialogY + 280 && pos.y <= dialogY + 330) { startGameSession(currentMode, selectedAdvLevel); return; }
                    return;
                }

                if (pos.x >= BTN_BACK.x && pos.x <= BTN_BACK.x + BTN_BACK.w && pos.y >= BTN_BACK.y && pos.y <= BTN_BACK.y + BTN_BACK.h) {
                    gameState = currentMode === "ADVENTURE" ? "MAP" : "MENU"; return;
                }

                let boosterRects = getBoosterRects();
                for (let b of boosterRects) {
                    if (pos.x >= b.x && pos.x <= b.x + b.w && pos.y >= b.y && pos.y <= b.y + b.h) { executeBooster(b.type); return; }
                }

                let slotRects = getSlotRects();
                for (let i = 0; i < 3; i++) {
                    let slot = slotRects[i];
                    if (pos.x >= slot.x && pos.x <= slot.x + slot.w && pos.y >= slot.y && pos.y <= slot.y + slot.h && current_blocks[i] !== null) {
                        if (rotateModeActive) {
                            current_blocks[i] = rotateShapeData(current_blocks[i]);
                            rotateModeActive = false; playSound(400, 0.1, 'sine'); addFloatingText(t("rotatedText"), slot.x + slot.w/2, slot.y, "#FACC15");
                        } else {
                            selected_block_idx = i; dragging = true;
                            updateDragPosition(pos, current_blocks[i]);
                        }
                    }
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (gameState !== "GAME" || !dragging || selected_block_idx === null) return;
            let pos = getMousePos(e);
            updateDragPosition(pos, current_blocks[selected_block_idx]);
        });

        canvas.addEventListener('mouseup', (e) => {
            if (gameState !== "GAME" || !dragging || selected_block_idx === null) return;
            dragging = false;

            let gp = getGridParams();
            let gridCol = Math.round((block_x - gp.offsetX) / (gp.cellSize + gp.gap));
            let gridRow = Math.round((block_y - gp.offsetY) / (gp.cellSize + gp.gap));

            let b = current_blocks[selected_block_idx];
            if (canPlace(b.shape, gridCol, gridRow)) {
                placeBlock(b, gridCol, gridRow);
                current_blocks[selected_block_idx] = null;
                clearLines();
                if (current_blocks.every(bl => bl === null)) generateNewBlocks();
                if (checkGameOver() && !levelComplete) { gameOver = true; playSound(180, 0.4, 'square'); }
            }
            selected_block_idx = null;
        });

        canvas.addEventListener('touchstart', (e) => {
            let touch = e.touches[0];
            canvas.dispatchEvent(new MouseEvent("mousedown", { clientX: touch.clientX, clientY: touch.clientY }));
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            let touch = e.touches[0];
            canvas.dispatchEvent(new MouseEvent("mousemove", { clientX: touch.clientX, clientY: touch.clientY }));
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            canvas.dispatchEvent(new MouseEvent("mouseup", {}));
            e.preventDefault();
        }, { passive: false });

        function gameLoop(timestamp) {
            let dt = (timestamp - lastTime) / 1000.0;
            lastTime = timestamp;
            if (dt > 0.1) dt = 0.1;

            if (gameState === "WHEEL" && wheelSpinning) {
                wheelAngle += wheelVelocity;
                wheelVelocity *= 0.975;
                if (wheelVelocity < 0.002) {
                    wheelVelocity = 0;
                    wheelSpinning = false;
                    
                    let sliceAngle = (Math.PI * 2) / wheelSlices.length;
                    let effectiveAngle = (2 * Math.PI - (wheelAngle % (Math.PI * 2))) % (Math.PI * 2);
                    let winningIndex = Math.floor(effectiveAngle / sliceAngle) % wheelSlices.length;
                    
                    wheelBaseWin = wheelSlices[winningIndex];
                    
                    let diff = getDaysDiff(lastDailyClaim);
                    if (diff === 1) dailyStreak++;
                    else if (diff > 1) dailyStreak = 1;
                    
                    let multi = Math.min(dailyStreak, 7);
                    wheelResult = wheelBaseWin * multi;

                    coins += wheelResult;
                    lastDailyClaim = new Date().toDateString();
                    stats.wheelSpins++;
                    saveGameData();
                    playSound(950, 0.5, 'square');
                    spawnParticles(canvas.width / 2, canvas.height / 2, 40, ["#FACC15", "#38BDF8", "#22C55E"], true);
                }
            }

            if (gameState === "GAME" && (currentMode === "ZEIT" || (currentMode === "ADVENTURE" && advLevelType === "time")) && !gameOver && !levelComplete) {
                timeLeft -= dt;
                if (timeLeft <= 0) { timeLeft = 0; gameOver = true; playSound(180, 0.4, 'square'); }
            }

            updateEffects();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === "MENU") drawMainMenu();
            else if (gameState === "WHEEL") drawWheelMenu();
            else if (gameState === "SHOP") drawShopMenu();
            else if (gameState === "ACHIEVEMENTS") drawAchievements();
            else if (gameState === "MAP") drawAdventureMap();
            else if (gameState === "GAME") drawGame();

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame((ts) => { lastTime = ts; gameLoop(ts); });
    </script>

</body>
</html>
